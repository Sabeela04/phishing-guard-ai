<script>
/* =========================================================
   PHISHING GUARD AI
   Client-Side Demonstration Engine
   ========================================================= */

const historyData = [];


/* =========================================================
   BACKEND STATUS
   ========================================================= */

function checkBackend() {
    const badge = document.getElementById("backendBadge");

    if (!badge) return;

    badge.textContent = "● AI ENGINE ONLINE";
    badge.style.color = "var(--green)";
}


/* =========================================================
   EXAMPLE INPUTS
   ========================================================= */

function loadExample(type) {

    const input = document.getElementById("input");

    if (!input) return;

    if (type === "safe") {

        input.value = "https://www.wikipedia.org/";

    } else {

        input.value =
            "URGENT! Your bank account will be suspended immediately. " +
            "Verify your password and OTP by clicking here: " +
            "https://secure-bank-login-example.com/verify";
    }
}


/* =========================================================
   MAIN ANALYSIS FUNCTION
   ========================================================= */

function analyze() {

    const input = document.getElementById("input");
    const result = document.getElementById("result");
    const button = document.getElementById("scanBtn");

    if (!input || !result || !button) {
        console.error("Required HTML elements are missing.");
        return;
    }

    const content = input.value.trim();

    if (!content) {

        alert("Please enter a URL or message first.");
        return;
    }


    /* Disable button while analysing */

    button.disabled = true;
    button.textContent = "⏳ ANALYZING...";


    result.innerHTML =
        '<div class="empty">AI engine is analyzing the content...</div>';


    /* Small delay to make the demo feel like an AI analysis */

    setTimeout(function () {

        try {

            const data = analyzeContent(content);

            render(data);


            /* Add scan to history */

            historyData.unshift({

                time: new Date().toLocaleTimeString(),

                label: data.classification,

                score: data.score,

                preview: content
                    .replace(/\s+/g, " ")
                    .slice(0, 65)

            });


            renderHistory();


        } catch (error) {

            console.error("Analysis error:", error);

            result.innerHTML =
                '<div class="empty" style="color:var(--red)">' +
                'Unable to analyze the input.' +
                '</div>';
        }


        button.disabled = false;
        button.textContent = "⚡ ANALYZE THREAT";

    }, 700);
}


/* =========================================================
   PHISHING ANALYSIS ENGINE
   ========================================================= */

function analyzeContent(content) {

    const lower = content.toLowerCase();

    let score = 0;

    const signals = [];


    /* -----------------------------------------------------
       URL EXTRACTION
       ----------------------------------------------------- */

    const urls =
        content.match(
            /https?:\/\/[^\s]+|www\.[^\s]+/gi
        ) || [];


    /* -----------------------------------------------------
       URL ANALYSIS
       ----------------------------------------------------- */

    urls.forEach(function (url) {

        const cleanUrl = url.toLowerCase();


        /* HTTP */

        if (cleanUrl.startsWith("http://")) {

            score += 10;

            signals.push({
                name: "Unencrypted HTTP connection",
                points: 10
            });
        }


        /* @ symbol */

        if (cleanUrl.includes("@")) {

            score += 25;

            signals.push({
                name: "Obfuscated URL using @ symbol",
                points: 25
            });
        }


        /* Long URL */

        if (url.length > 80) {

            score += 10;

            signals.push({
                name: "Unusually long URL",
                points: 10
            });
        }


        /* Multiple hyphens */

        const hyphenCount =
            (url.match(/-/g) || []).length;

        if (hyphenCount >= 2) {

            score += 8;

            signals.push({
                name: "Multiple hyphens in domain",
                points: 8
            });
        }


        /* Suspicious URL keywords */

        const suspiciousDomainWords = [

            "login",
            "verify",
            "secure",
            "account",
            "update",
            "bank",
            "signin",
            "password"

        ];


        suspiciousDomainWords.forEach(function (word) {

            if (cleanUrl.includes(word)) {

                score += 8;

                signals.push({

                    name:
                        "Suspicious keyword in URL: " +
                        word,

                    points: 8

                });
            }
        });


        /* URL shorteners */

        const shorteners = [

            "bit.ly",
            "tinyurl.com",
            "t.co",
            "goo.gl",
            "is.gd",
            "ow.ly"

        ];


        if (
            shorteners.some(function (shortener) {

                return cleanUrl.includes(shortener);

            })
        ) {

            score += 20;

            signals.push({

                name: "URL shortener detected",

                points: 20

            });
        }


        /* IP address instead of domain */

        const ipPattern =
            /https?:\/\/(?:\d{1,3}\.){3}\d{1,3}/i;

        if (ipPattern.test(url)) {

            score += 15;

            signals.push({

                name: "IP address used instead of domain name",

                points: 15

            });
        }


        /* Excessive subdomains */

        const domainPart =
            url
                .replace(/^https?:\/\//i, "")
                .split("/")[0];

        const dotCount =
            (domainPart.match(/\./g) || []).length;

        if (dotCount >= 3) {

            score += 10;

            signals.push({

                name: "Multiple subdomains detected",

                points: 10

            });
        }

    });


    /* =====================================================
       MESSAGE ANALYSIS
       ===================================================== */

    const suspiciousWords = [

        "urgent",
        "immediately",
        "verify",
        "verification",
        "suspended",
        "password",
        "otp",
        "bank",
        "login",
        "click here",
        "security alert",
        "confirm your",
        "limited time",
        "account will be",
        "unauthorized",
        "security warning"

    ];


    suspiciousWords.forEach(function (word) {

        if (lower.includes(word)) {

            score += 6;

            signals.push({

                name:
                    "Suspicious language: " +
                    word,

                points: 6

            });
        }
    });


    /* =====================================================
       REWARD / LURE DETECTION
       ===================================================== */

    const lureWords = [

        "winner",
        "prize",
        "reward",
        "free",
        "claim now",
        "gift",
        "offer",
        "congratulations",
        "cash prize"

    ];


    lureWords.forEach(function (word) {

        if (lower.includes(word)) {

            score += 7;

            signals.push({

                name:
                    "Potential lure/reward language: " +
                    word,

                points: 7

            });
        }
    });


    /* =====================================================
       PERSONAL INFORMATION REQUEST
       ===================================================== */

    const sensitiveRequests = [

        "enter your password",
        "provide your password",
        "enter otp",
        "share otp",
        "enter card number",
        "credit card",
        "debit card",
        "bank details",
        "account details"

    ];


    sensitiveRequests.forEach(function (phrase) {

        if (lower.includes(phrase)) {

            score += 12;

            signals.push({

                name:
                    "Request for sensitive information: " +
                    phrase,

                points: 12

            });
        }
    });


    /* =====================================================
       PRESSURE / FEAR LANGUAGE
       ===================================================== */

    const pressureWords = [

        "account blocked",
        "account suspended",
        "account will be closed",
        "last warning",
        "action required",
        "act now",
        "respond immediately"

    ];


    pressureWords.forEach(function (phrase) {

        if (lower.includes(phrase)) {

            score += 8;

            signals.push({

                name:
                    "Pressure or fear-based language: " +
                    phrase,

                points: 8

            });
        }
    });


    /* =====================================================
       SCORE LIMIT
       ===================================================== */

    score = Math.min(score, 100);


    /* =====================================================
       CLASSIFICATION
       ===================================================== */

    let classification;
    let action;


    if (score >= 65) {

        classification = "PHISHING";

        action = "QUARANTINE / BLOCK";

    } else if (score >= 35) {

        classification = "SUSPICIOUS";

        action = "WARN / REVIEW";

    } else {

        classification = "LEGITIMATE";

        action = "ALLOW";
    }


    /* =====================================================
       REMOVE DUPLICATE INDICATORS
       ===================================================== */

    const uniqueSignals = [];

    const seen = new Set();


    signals.forEach(function (signal) {

        if (!seen.has(signal.name)) {

            seen.add(signal.name);

            uniqueSignals.push(signal);
        }
    });


    /* =====================================================
       RETURN ANALYSIS RESULT
       ===================================================== */

    return {

        score: score,

        classification: classification,

        recommended_action: action,

        signals: uniqueSignals,

        urls_found: urls.length,

        input_length: content.length
    };
}


/* =========================================================
   DISPLAY RESULT
   ========================================================= */

function render(data) {

    const result = document.getElementById("result");

    if (!result) return;


    let className;

    if (data.classification === "PHISHING") {

        className = "phishing";

    } else if (data.classification === "SUSPICIOUS") {

        className = "suspicious";

    } else {

        className = "safe";
    }


    let color;

    if (className === "phishing") {

        color = "var(--red)";

    } else if (className === "suspicious") {

        color = "var(--yellow)";

    } else {

        color = "var(--green)";
    }


    const degrees = data.score * 3.6;


    /* Indicator HTML */

    let signalHTML = "";


    if (data.signals.length > 0) {

        signalHTML = data.signals.map(function (signal) {

            return `

                <div class="signal">

                    <b>
                        ${escapeHtml(signal.name)}
                    </b>

                    <span class="pts">
                        +${signal.points}
                    </span>

                </div>

            `;

        }).join("");

    } else {

        signalHTML = `

            <div class="signal">

                No major phishing indicators detected.

            </div>

        `;
    }


    /* Result */

    result.innerHTML = `

        <div class="result">

            <div
                class="score"
                style="
                    background:
                    conic-gradient(
                        ${color}
                        ${degrees}deg,
                        #182a39
                        ${degrees}deg
                    );
                "
            >

                <strong>
                    ${data.score}
                </strong>

                <small>
                    RISK / 100
                </small>

            </div>


            <div>

                <div class="status ${className}">

                    ${data.classification}

                </div>


                <div class="action">

                    Recommended action:

                    <b>
                        ${data.recommended_action}
                    </b>

                </div>

            </div>

        </div>


        <div class="signals">

            <h3 style="font-size:14px">

                Detected Indicators

            </h3>

            ${signalHTML}

        </div>


        <div class="stats">

            <div class="stat">

                <b>
                    ${data.signals.length}
                </b>

                <span>
                    Indicators
                </span>

            </div>


            <div class="stat">

                <b>
                    ${data.urls_found}
                </b>

                <span>
                    URLs Found
                </span>

            </div>


            <div class="stat">

                <b>
                    ${data.input_length}
                </b>

                <span>
                    Characters
                </span>

            </div>

        </div>

    `;
}


/* =========================================================
   DETECTION HISTORY
   ========================================================= */

function renderHistory() {

    const history = document.getElementById("history");

    if (!history) return;


    if (historyData.length === 0) {

        history.innerHTML =
            '<div class="empty">No scans yet.</div>';

        return;
    }


    history.innerHTML =

        historyData
            .slice(0, 6)
            .map(function (item) {


                let className;

                if (item.label === "PHISHING") {

                    className = "phishing";

                } else if (item.label === "SUSPICIOUS") {

                    className = "suspicious";

                } else {

                    className = "safe";
                }


                return `

                    <div class="history-item">

                        <span>

                            ${escapeHtml(item.preview)}…

                        </span>


                        <span>

                            <b>
                                ${item.score}/100
                            </b>


                            <span class="pill ${className}">

                                ${item.label}

                            </span>


                            <small>
                                ${item.time}
                            </small>

                        </span>

                    </div>

                `;

            })
            .join("");
}


/* =========================================================
   SECURITY: ESCAPE HTML
   ========================================================= */

function escapeHtml(text) {

    return String(text).replace(

        /[&<>"']/g,

        function (character) {

            const entities = {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            };

            return entities[character];
        }
    );
}


/* =========================================================
   START APPLICATION
   ========================================================= */

document.addEventListener("DOMContentLoaded", function () {

    checkBackend();

    renderHistory();

});
</script>
