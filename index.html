<script>
const historyData=[];

function checkBackend(){
  document.getElementById("backendBadge").textContent="● AI ENGINE ONLINE";
  document.getElementById("backendBadge").style.color="var(--green)";
}

function loadExample(k){
  document.getElementById("input").value =
    k==="safe"
    ? "https://www.wikipedia.org/"
    : "URGENT! Your bank account will be suspended immediately. Verify your password and OTP by clicking here: https://secure-bank-login-example.com/verify";
}

function analyze(){
  const content=document.getElementById("input").value.trim();

  if(!content){
    alert("Please enter a URL or message first.");
    return;
  }

  const btn=document.getElementById("scanBtn");
  btn.disabled=true;
  btn.textContent="⏳ ANALYZING...";

  document.getElementById("result").innerHTML=
    '<div class="empty">AI engine is analyzing the content...</div>';

  setTimeout(()=>{
    const data=analyzeContent(content);

    render(data);

    historyData.unshift({
      time:new Date().toLocaleTimeString(),
      label:data.classification,
      score:data.score,
      preview:content.replace(/\s+/g," ").slice(0,65)
    });

    renderHistory();

    btn.disabled=false;
    btn.textContent="⚡ ANALYZE THREAT";
  },700);
}

function analyzeContent(content){

  const lower=content.toLowerCase();
  const signals=[];
  let score=0;

  const urls=content.match(/https?:\/\/[^\s]+|www\.[^\s]+/gi) || [];

  /* URL ANALYSIS */

  urls.forEach(url=>{

    if(url.startsWith("http://")){
      score+=10;
      signals.push({
        name:"Unencrypted HTTP connection",
        points:10
      });
    }

    if(url.includes("@")){
      score+=25;
      signals.push({
        name:"Obfuscated URL using @ symbol",
        points:25
      });
    }

    if(url.length>80){
      score+=10;
      signals.push({
        name:"Unusually long URL",
        points:10
      });
    }

    if((url.match(/-/g)||[]).length>=2){
      score+=8;
      signals.push({
        name:"Multiple hyphens in domain",
        points:8
      });
    }

    const suspiciousDomainWords=[
      "login","verify","secure","account",
      "update","bank","signin","password"
    ];

    suspiciousDomainWords.forEach(word=>{
      if(url.toLowerCase().includes(word)){
        score+=8;
        signals.push({
          name:"Suspicious keyword in URL: "+word,
          points:8
        });
      }
    });

    const shorteners=[
      "bit.ly","tinyurl.com","t.co",
      "goo.gl","is.gd","ow.ly"
    ];

    if(shorteners.some(x=>url.toLowerCase().includes(x))){
      score+=20;
      signals.push({
        name:"URL shortener detected",
        points:20
      });
    }
  });

  /* MESSAGE ANALYSIS */

  const suspiciousWords=[
    "urgent",
    "immediately",
    "verify",
    "verification",
    "suspended",
    "password",
    "otp",
    "bank",
    "login",
    "click here",
    "security alert",
    "confirm your",
    "limited time"
  ];

  suspiciousWords.forEach(word=>{
    if(lower.includes(word)){
      score+=6;
      signals.push({
        name:"Suspicious language: "+word,
        points:6
      });
    }
  });

  /* REWARD / LURE DETECTION */

  const lureWords=[
    "winner",
    "prize",
    "reward",
    "free",
    "claim now",
    "gift",
    "offer"
  ];

  lureWords.forEach(word=>{
    if(lower.includes(word)){
      score+=7;
      signals.push({
        name:"Potential lure/reward language: "+word,
        points:7
      });
    }
  });

  /* LIMIT SCORE */

  score=Math.min(score,100);

  let classification;
  let action;

  if(score>=65){
    classification="PHISHING";
    action="QUARANTINE / BLOCK";
  }
  else if(score>=35){
    classification="SUSPICIOUS";
    action="WARN / REVIEW";
  }
  else{
    classification="LEGITIMATE";
    action="ALLOW";
  }

  /* REMOVE DUPLICATE INDICATORS */

  const uniqueSignals=[];
  const seen=new Set();

  signals.forEach(s=>{
    if(!seen.has(s.name)){
      seen.add(s.name);
      uniqueSignals.push(s);
    }
  });

  return {
    score:score,
    classification:classification,
    recommended_action:action,
    signals:uniqueSignals,
    urls_found:urls.length,
    input_length:content.length
  };
}

function render(d){

  const cls=
    d.classification==="PHISHING"
    ? "phishing"
    : d.classification==="SUSPICIOUS"
    ? "suspicious"
    : "safe";

  const color=
    cls==="phishing"
    ? "var(--red)"
    : cls==="suspicious"
    ? "var(--yellow)"
    : "var(--green)";

  const deg=d.score*3.6;

  document.getElementById("result").innerHTML=`

    <div class="result">

      <div class="score"
        style="background:conic-gradient(
          ${color} ${deg}deg,
          #182a39 ${deg}deg
        )">

        <strong>${d.score}</strong>
        <small>RISK / 100</small>

      </div>

      <div>

        <div class="status ${cls}">
          ${d.classification}
        </div>

        <div class="action">
          Recommended action:
          <b>${d.recommended_action}</b>
        </div>

      </div>

    </div>

    <div class="signals">

      <h3 style="font-size:14px">
        Detected Indicators
      </h3>

      ${
        d.signals.length
        ?
        d.signals.map(s=>`

          <div class="signal">

            <b>${escapeHtml(s.name)}</b>

            <span class="pts">
              +${s.points}
            </span>

          </div>

        `).join("")
        :
        `
        <div class="signal">
          No major phishing indicators detected.
        </div>
        `
      }

    </div>

    <div class="stats">

      <div class="stat">
        <b>${d.signals.length}</b>
        <span>Indicators</span>
      </div>

      <div class="stat">
        <b>${d.urls_found}</b>
        <span>URLs Found</span>
      </div>

      <div class="stat">
        <b>${d.input_length}</b>
        <span>Characters</span>
      </div>

    </div>
  `;
}

function renderHistory(){

  document.getElementById("history").innerHTML=

    historyData.slice(0,6).map(x=>{

      const c=
        x.label==="PHISHING"
        ? "phishing"
        : x.label==="SUSPICIOUS"
        ? "suspicious"
        : "safe";

      return `

        <div class="history-item">

          <span>
            ${escapeHtml(x.preview)}…
          </span>

          <span>

            <b>${x.score}/100</b>

            <span class="pill ${c}">
              ${x.label}
            </span>

            <small>${x.time}</small>

          </span>

        </div>

      `;

    }).join("");
}

function escapeHtml(s){

  return s.replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );
}

checkBackend();
</script>
